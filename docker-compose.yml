networks:
  # 'docker-compose up' will create this as a 'bridge' network
  booking-network:

services:
  user-service-db:
    image: postgres:17-alpine
    container_name: user-service_db
    # Added profile: This service won't start unless you use --profile infra
    profiles: ["infra"]
    ports:
      - "5431:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U user-service -d vexesieure_user-service_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=user-service
      - POSTGRES_PASSWORD=user-service-db-password
      - POSTGRES_DB=vexesieure_user-service_db
    volumes:
      - user-service-db:/var/lib/postgresql/data
    networks:
      - booking-network

  booking-service-db:
    image: postgres:17-alpine
    container_name: booking-service_db
    profiles: ["infra"]
    ports:
      - "5433:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U booking-service -d vexesieure_booking-service_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=booking-service
      - POSTGRES_PASSWORD=booking-service-db-password
      - POSTGRES_DB=vexesieure_booking-service_db
    volumes:
      - booking-service-db:/var/lib/postgresql/data
    networks:
      - booking-network

  # --- 1. Configuration Server ---
  config-server:
    hostname: config-server
    profiles: ["core"]
    build:
      context: ./config-server
      dockerfile: Dockerfile.dev
      args:
        # This path is from your Dockerfile
        JAR_FILE: config-server-0.0.1-SNAPSHOT.jar
    image: com.booking/config-server:0.0.1-SNAPSHOT
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8888'"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - SPRING_PROFILES_ACTIVE=${ACTIVE_PROFILE}
      # This reads the PAT from your .env file
      - GITHUB_PAT=${GITHUB_PAT}
    networks:
      - booking-network

  service-registry:
    hostname: service-registry
    profiles: ["core"]
    build:
      context: ./service-registry
      dockerfile: Dockerfile.dev
      args:
        JAR_FILE: service-registry-0.0.1-SNAPSHOT.jar
    image: com.booking/service-registry:0.0.1-SNAPSHOT
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081'"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${ACTIVE_PROFILE}
    networks:
      - booking-network

  # --- 3. User Service ---
  user-service:
    hostname: user-service
    profiles: ["apps"]
    build:
      context: ./services/user-service
      dockerfile: Dockerfile.dev
      args:
        JAR_FILE: user-service-0.0.1-SNAPSHOT.jar
    image: com.booking/user-service:0.0.1-SNAPSHOT
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8082'"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      booking-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${ACTIVE_PROFILE}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    networks:
      - booking-network

  booking-service:
    hostname: booking-service
    profiles: ["apps"]
    build:
      context: ./services/booking-service
      dockerfile: Dockerfile.dev
      args:
        JAR_FILE: booking-service-0.0.1-SNAPSHOT.jar
    image: com.booking/booking-service:0.0.1-SNAPSHOT
    ports:
      - "8083:8083"
      - "9085:9085" # Socket.IO
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8083'"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=${ACTIVE_PROFILE}
    networks:
      - booking-network

  redis:
    image: redis:alpine
    container_name: booking-redis
    # Added profile
    profiles: ["infra"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - booking-network

  # --- 4. API Gateway ---
  api-gateway:
    hostname: api-gateway
    profiles: ["core"]
    build:
      context: ./api-gateway
      dockerfile: Dockerfile.dev
      args:
        JAR_FILE: api-gateway-0.0.1-SNAPSHOT.jar
    image: com.booking/api-gateway:0.0.1-SNAPSHOT
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    environment:
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY=DEBUG
      - LOGGING_LEVEL_REACTOR_NETTY_HTTP_CLIENT=DEBUG
      - SPRING_APPLICATION_ADMIN_ENABLED=true
      - SPRING_PROFILES_ACTIVE=${ACTIVE_PROFILE}
    networks:
      - booking-network

volumes:
  user-service-db:
  booking-service-db:
